<body>
<div id="room" class="is-off" data-phosphor="red">
  <canvas id="dust" aria-hidden="true"></canvas>
  <div id="glow" aria-hidden="true"></div>

  <div id="stage">
    <div id="scene">
      <!-- 3D world: desk, machine body, keyboard, mouse. The eye position is a CSS perspective-origin,
           so the front of the machine (and the screen, which is a separate flat layer) stays undistorted. -->
      <div id="world" aria-hidden="true">
        <div id="desk" class="face">
          <div class="shadow shadow-mac"></div>
          <div class="shadow shadow-kb"></div>
          <div class="shadow shadow-mouse"></div>
          <svg class="cables" viewBox="0 0 3200 2600" width="3200" height="2600"></svg>
          <div class="pool"></div>
        </div>

        <div id="mac">
          <div class="face f-top">
            <div class="t-seam"></div>
            <div class="t-vents"></div>
            <div class="t-handle"></div>
          </div>
          <div class="face f-right">
            <div class="s-seam"></div>
            <div class="s-vents"></div>
            <div class="switch">
              <span class="switch-label">POWER</span>
              <button id="power" class="rocker" type="button" aria-pressed="false" aria-label="Power switch — turn the Mac on">
                <span class="rocker-cap"><i>I</i><i>O</i></span>
              </button>
              <span class="led"></span>
            </div>
            <div class="s-lit"></div>
          </div>
          <div class="face f-front">
            <div class="bezel"></div>
            <div class="dial" title="Brightness"></div>
            <div class="floppy"><span></span><i></i></div>
            <div class="badge"><span class="stripes"></span><span class="nine">9</span></div>
            <div class="nameplate">9lordisgod <small>SE</small></div>
            <div class="f-lit"></div>
          </div>
        </div>

        <div id="keyboard">
          <div class="face kb-top"><div class="kb-keys"></div><div class="kb-lit"></div></div>
          <div class="face kb-front"></div>
          <div class="face kb-side"></div>
        </div>
        <div id="mouse">
          <div class="face m-top"></div>
          <div class="face m-front"></div>
          <div class="face m-side"></div>
        </div>
      </div>

      <!-- the tube: a flat layer sitting exactly in the bezel opening (z = 0), so text stays crisp -->
      <div class="crt" id="crt">
        <div class="raster" id="display">
          <div id="boot" class="layer" hidden></div>
          <div id="desktop" class="layer" hidden>
            <div id="menubar"></div>
            <div id="icons"></div>
            <div id="windows"></div>
            <div id="dropdowns"></div>
          </div>
          <div id="fx" class="layer" aria-hidden="true"></div>
        </div>
        <div class="beam" aria-hidden="true"></div>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="glass" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div id="hint" class="hint" aria-live="polite"></div>

  <nav class="corner" aria-label="Quick links">
    <a href="https://github.com/9lordisgod" target="_blank" rel="noopener">GitHub</a>
    <a href="https://x.com/williemdoe" target="_blank" rel="noopener">X</a>

      <div id="plainBody"></div>
    </div>
  </section>
